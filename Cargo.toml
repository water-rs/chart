[package]
name = "waterui-chart"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/chart"
description = "Chart components for WaterUI with GPU-accelerated rendering"
keywords = ["chart", "visualization", "gpu", "waterui"]
categories = ["gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []

[dependencies]
waterui-core = { version = "0.3.0" }
waterui-graphics = { version = "0.3.0" }
waterui-canvas = "0.1.0"
waterui-layout = { version = "0.3.0" }
waterui-shape = { version = "0.1.0" }
waterui-text = { version = "0.3.0" }
nami = "0.11.0"
bytemuck = { version = "1.25", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
hydrolysis-m3 = "0.1.0"
waterui-testing = "0.3.0"
waterui = "0.3.0"
