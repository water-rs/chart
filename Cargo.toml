[workspace]
members = ["examples/chart"]
resolver = "2"

[workspace.dependencies]
hydrolysis-m3 = "0.3.0"
waterui-testing = "0.5.0"
waterui = "0.5.0"

[package]
name = "waterui-chart"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/chart"
description = "Chart components for WaterUI with GPU-accelerated rendering"
keywords = ["chart", "visualization", "gpu", "waterui"]
categories = ["gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []

[dependencies]
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0" }
waterui-canvas = "0.2.0"
waterui-layout = { version = "0.5.0" }
waterui-shape = { version = "0.5.0" }
waterui-text = { version = "0.5.0" }
nami = "=0.11.1"
bytemuck = { version = "1.25", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
hydrolysis-m3 = "0.3.0"
waterui-testing = "0.5.0"

# The 0.5.0 framework release is in flight from b25438ae on `water-rs/waterui`
# `main`; release-plz publishes the `waterui-*` version group from that commit
# in dependency order. Until every crate this graph resolves is on crates.io,
# all of them are pinned to that same commit: the framework crates reach each
# other by path, so a registry copy beside a git twin would compile two
# `waterui-core`. Sibling components and the hydrolysis pair are pinned to their
# own `release/0.5.0-wave` commits, which require the same framework versions.
# Publishing ignores this table; it drops once the wave is on the registry.
waterui = "0.5.0"
# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
waterui-chart = { path = "." }
# Wave satellites this graph resolves, pinned to their `dev` HEADs. While the
# pins stand, every requirement names the version the pinned revision declares;
# the release commit drops the pins and bumps requirements to the wave versions
# (0.5.0 foundation, 0.3.0 hydrolysis*, …) once waterui 0.5.0 is on crates.io.
# `waterui-svg` is not patched here because `waterui-internal` names it by a
# direct git dependency, which a patch cannot redirect.
# Third-party forks the framework's own patch table carries; git dependencies
# do not propagate it, so they are repeated here.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "7f5e1ca5769a96dc4404b812e7fa0351499cd2c4" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }


# Migrated framework crates pinned to waterui's devin/chore/nami-snapshot
