[workspace]
members = ["examples/chart"]
resolver = "2"

[workspace.dependencies]
hydrolysis-m3 = "0.3.1"
waterui-testing = "0.5.1"
waterui = "0.5.2"

[package]
name = "waterui-chart"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/chart"
description = "Chart components for WaterUI with GPU-accelerated rendering"
keywords = ["chart", "visualization", "gpu", "waterui"]
categories = ["gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []

[dependencies]
waterui-core = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1", default-features = false }
waterui-canvas = "0.2.0"
waterui-layout = { version = "0.5.1" }
waterui-shape = { version = "0.5.1" }
waterui-text = { version = "0.5.1" }
nami = "=0.11.1"
bytemuck = { version = "1.25", features = ["derive"] }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
hydrolysis-m3 = "0.3.1"
waterui-testing = "0.5.1"

# The mounted end-to-end tests exercise the facade and its testing harness;
# the `[patch.crates-io]` table below resolves them to the cutover revisions.
waterui = "0.5.2"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so the ones this graph resolves are repeated
# here so it builds the same sources as water-rs/waterui at the pinned rev.
[patch.crates-io]
# The crate under test stands in for the published `waterui-chart` the facade
# and testing harness ask for.
waterui-chart = { path = "." }

xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
# The framework head the port builds against: water-rs/waterui at 0e1ae10,
# the `feat/1435-graphics-recorder` head carrying the render-target-neutral
# recording contract (water-rs/waterui#1435): `SceneContent::build_scene`
# records into `waterui_graphics::draw` (`cherenkov_record::Recorder`) and
# `SceneResources::new` takes the target's `SceneBackend`/`ShaderBackend`
# registry instead of `Rc<Engine<B>>`. Every `waterui-*` crate in the graph
# must resolve to this one rev — a registry `waterui-core` beside the
# facade's own path dependencies gives two `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }

# Extracted component crates. Those with no port yet ride the revisions the
# framework's own patch table pins at 0e1ae10 (barcode, particle, svg,
# video-gpu); `waterui-chart` itself is the local crate, patched at the top
# of the table. Canvas, image, map-gpu and math ride their dev heads where
# the recorder-port has landed — newer than the revs the framework's table
# names — because chart builds against the ported contract directly and its
# test graph pulls waterui-image through waterui-media.
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "491ada1c7db31bdab657135338a5bd670adbe61f" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", rev = "8533cf99f511801c1ad3ee5850a28eefa5aef3ef" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "759f907e2072c38616c85a928c6d95756883d20d" }
waterui-math = { git = "https://github.com/water-rs/math", rev = "765fb8bcd1e5dba30db973377ceabf12f9ed99f1" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "b07a8e7a950a4590c475edb65dc7abd967f7d820" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "50a87217658e9cf40024bf50619c4d7555a6415b" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "4f95775bcef3022e6d5a52c2aa09aee02afb628f" }

# The mounted test graph's backend pair at the revisions the framework's
# own patch table pins: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework revision
# as every `waterui-*` crate; its Material 3 theme is still external and
# rides the rev the framework pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "cc8be840d96be39dc6f23aeace7310801d7a5f35" }

# nami#26 renames `Signal::get` to `Signal::snapshot`; drop once released.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The Cherenkov engine family, now in-tree: the engine moved into
# water-rs/waterui under `graphics/` (water-rs/waterui#1449), and the
# stand-alone cherenkov repository is no longer the source. Its filtrate
# members are the filter library `.filter(F)`/`.effect(E)` and the engine
# agree on — every filtrate in the graph must come from this same revision
# or a filter built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "e9d66164f52284fc3922236e5bfcd9f60f4a0c05" }

# Every waterkit crate the codec graph shares types across rides the same rev
# — a registry `waterkit-core` beside the pinned `waterkit-codec` gives two
# decoder types. The rev is the one the cutover table pins.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }

# codec@4863ba5 asks for shaderloom's `runtime` feature, added after the
# 0.1.2 registry release — pin the same rev as the framework's table.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "84c37c8314f1bb6d228fce30f78d94872247a18f" }

# Mirrored from the in-tree cherenkov workspace patch (water-rs/cherenkov#229,
# carried into water-rs/waterui).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
